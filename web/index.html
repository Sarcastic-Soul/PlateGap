<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlateGap</title>
<meta name="description" content="Your meal plan is already paid for. PlateGap works out what it still leaves you short of, and the cheapest thing you can buy to fix it.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127869;</text></svg>">
<link rel="stylesheet" href="style.css">
<!-- Applies a stored theme before the first paint. See web/theme.js. -->
<script src="theme.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1>PlateGap <span>— what your meal plan leaves out</span></h1>
    <div id="theme"></div>
  </div>
</header>

<!-- What the page says before app.js runs. It is an <aside> and a <section>
     because <main> is a two-column grid: a <section> on its own would drop
     into the 290px sidebar column, and the page would jump sideways the
     moment Preact took over. -->
<div id="app">
  <main>
    <aside></aside>
    <section><div id="view"><p class="loading">Loading…</p></div></section>
  </main>
</div>

<footer>
  <p>
    Nutrients from USDA FoodData Central (SR Legacy) and IFCT 2017. The
    optimiser is a two-phase simplex written for this project, checked against
    SciPy. Every assumption is in the repository and can be argued with.
  </p>
</footer>

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
